name: links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC

permissions:
  contents: read

jobs:
  lychee:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 8
            --timeout 20
            --exclude-path ./node_modules
            --exclude '^https?://localhost'
            --exclude '^https?://127\.0\.0\.1'
            --exclude '^https?://horchd\.xyz'
            './**/*.md'
            './*.html'
          # Don't fail the build if upstream goes intermittently down;
          # the report shows up in the action summary either way.
          fail: false
